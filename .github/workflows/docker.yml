name: Lint & Build Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for HTML Hint)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML Code
        run: htmlhint index.html

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Pfade in Kleinschreibung konvertieren
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="scruzzi-website"
          
          IMAGE_TAG_LATEST="ghcr.io/${REPO_OWNER}/${REPO_NAME}/nice-bauch:latest"
          IMAGE_TAG_SHA="ghcr.io/${REPO_OWNER}/${REPO_NAME}/nice-bauch:${{ github.sha }}"
          
          echo "Bauen: ${IMAGE_TAG_LATEST}"
          docker build -t ${IMAGE_TAG_LATEST} -t ${IMAGE_TAG_SHA} .
          
          echo "Pushen..."
          docker push ${IMAGE_TAG_LATEST}
          docker push ${IMAGE_TAG_SHA}
