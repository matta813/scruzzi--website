# Shared semantic-release + Kaniko build/push flow, used by both
# scruzzi-website (locally) and channieinifigge-website (via `include:
# project:`). Relies only on GitLab's own predefined variables
# (CI_PROJECT_DIR, CI_REGISTRY*, CI_COMMIT_SHORT_SHA), so it needs no
# per-project customization. Consuming repos still define their own
# `stages`/`workflow` (this file only adds jobs) and their own `test`
# stage jobs (lint/tests differ per project).

release:
  stage: release
  image: node:22-alpine
  before_script:
    - apk add --no-cache git
  script:
    - npx --yes
      -p semantic-release@24.2.9
      -p @semantic-release/changelog@6.0.3
      -p @semantic-release/exec@7.1.0
      -p @semantic-release/git@10.0.1
      -p @semantic-release/gitlab@13.3.3
      -p conventional-changelog-conventionalcommits@8.0.0
      semantic-release
    # Ohne neue Version bleibt release.env leer → build/deploy überspringen sich selbst
    - test -f release.env || echo "RELEASE_VERSION=" > release.env
  artifacts:
    reports:
      dotenv: release.env

build-and-push:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      if [ -z "${RELEASE_VERSION}" ]; then
        echo "Keine neue Version durch semantic-release — Build übersprungen."
        exit 0
      fi
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${RELEASE_VERSION}"
      --destination "${CI_REGISTRY_IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
