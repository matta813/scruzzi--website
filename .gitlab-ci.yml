# CI/CD-Flow (Commit → Lint/Test/SAST → Version-Bump → Image-Build → Renovate → GitOps):
#
#   1. test      Lint (ruff), Unit-Tests (pytest) und Commitlint für
#                server.py, plus GitLab SAST auf den Python-Code.
#   2. release   semantic-release analysiert die Conventional Commits auf
#                main (feat: → minor, fix: → patch, BREAKING CHANGE →
#                major), bestimmt die nächste SemVer-Version, schreibt
#                CHANGELOG.md zurück ins Repo ([skip ci]), setzt den
#                Git-Tag vX.Y.Z und erstellt ein GitLab-Release.
#                Gibt es keine release-würdigen Commits (nur chore/docs/
#                ci/…), endet die Pipeline hier ohne Build.
#   3. build     Kaniko baut das Image und pusht es in die Registry als
#                :X.Y.Z (Deployment-Tag), :sha-<commit> (Nachvollzieh-
#                barkeit) und :latest (nur für docker-compose/Fallback —
#                das Cluster-Deployment nutzt den Versions-Tag).
#   4. renovate  Läuft NICHT bei normalen Pushes, sondern nur über einen
#                GitLab Pipeline Schedule (Settings → CI/CD → Schedules).
#                Aktualisiert Dockerfile-Digest und die in .gitlab-ci.yml/
#                .gitlab/ci-templates/ gepinnten Tool-Versionen (ruff,
#                pytest, commitlint, semantic-release-Plugins) per MR.
#                Eigenständig vom cluster-weiten Renovate im GitOps-Repo,
#                das nur apps-flux/*.yaml-Image-Tags beobachtet und nie
#                in dieses Repo hineinschaut.
#
# release + build-and-push + self-renovate kommen aus den gemeinsamen
# Templates unter .gitlab/ci-templates/ (auch von channieinifigge-website
# per `include: project:` genutzt).
#
# Ausrollen: Renovate (läuft stündlich im Cluster) erkennt den neuen
# Registry-Tag und erstellt im GitOps-Repo einen MR, der den Versions-Tag
# in apps-flux/scruzzi/scruzzi.yaml bumpt (Patch-Updates werden
# automerged). Nach dem Merge rollt Flux die neue Version aus.
#
# Benötigte CI/CD-Variable (Settings → CI/CD → Variables, masked, KEINE
# Secrets im Repo):
#   GITLAB_TOKEN  Project Access Token DIESES Repos (Scopes: api,
#                 write_repository) — für semantic-release (Tag, Release,
#                 CHANGELOG-Commit) UND für self-renovate (MRs).

include:
  - local: .gitlab/ci-templates/release-and-build.yml
  - local: .gitlab/ci-templates/self-renovate.yml
  - template: Security/SAST.gitlab-ci.yml

stages:
  - test
  - release
  - build
  - renovate

workflow:
  rules:
    # Kein Pipeline-Lauf für die von semantic-release gepushten Tags
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

lint:
  stage: test
  image: python:3.13-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - pip install --quiet ruff==0.16.0
    - ruff check server.py tests/

test:
  stage: test
  image: python:3.13-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - pip install --quiet pytest==9.1.1
    - python -m pytest tests/ -v

commitlint:
  stage: test
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  before_script:
    - apk add --no-cache git
  script:
    - FROM_SHA="${CI_COMMIT_BEFORE_SHA}"
    - |
      if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
        FROM_SHA="HEAD~1"
      fi
    - npx --yes -p @commitlint/cli@21.2.1 -p @commitlint/config-conventional@21.2.0
      commitlint --from "$FROM_SHA" --to "$CI_COMMIT_SHA"
