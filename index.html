<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nice Bauch</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <meta name="description"
    content="Ein interaktives Single-Page-Setup. Minimaler Overhead, voller Fokus auf das Nice-Level." />
  <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>
  <div class="shell"></div>
  <div class="card" id="main-card">
    <div class="grid">
      <div>
        <div class="badge">aktiv</div>
        <h1>nice Bauch</h1>
        <p class="sub">läuft auf einem festen Port 🎯</p>

        <div class="interactive-area">
          <label class="meter-label" for="nice-btn">Nice-Bauch-Level</label>
          <div class="counter-val" id="counter">0</div>
          <button class="pill-btn" id="nice-btn" aria-label="Bauch streicheln, um Nice-Level zu erhöhen">Bauch
            streicheln ✨</button>
          <div id="quote-box"></div>
        </div>

        <div class="meta">
          <div class="chip">Port 8085</div>
          <div class="chip">Nginx / Docker</div>
          <div class="chip">modern UX</div>
        </div>
      </div>
      <div class="panel">
        <h2>Was steckt dahinter?</h2>
        <p>Ein interaktives Single-Page-Setup. Minimaler Overhead, voller Fokus auf das "Nice-Level". Dein Fortschritt
          wird lokal gespeichert.</p>
        <footer>Ubuntu Server — powered by JS & Nginx</footer>
      </div>
    </div>
  </div>

  <script src="main.js?v=3"></script>
</body>

</html>
