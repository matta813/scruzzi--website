---
kind: pipeline
type: kubernetes
name: release

trigger:
  event:
    - push
  ref:
    include:
      - refs/heads/main

steps:
  - name: release
    image: alpine
    commands:
      - apk add --no-cache git openssh-client
      - |
        set -eu
        git config user.email "drone@scruzzi.com"
        git config user.name "Drone CI"
        
        git remote set-url origin "gitea@192.168.0.45:${DRONE_REPO_OWNER}/${DRONE_REPO_NAME}.git"
        
        LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || echo "")
        
        if [ -z "$LATEST_TAG" ]; then
          NEXT_VERSION="v1.0.0"
        else
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
        fi
        
        echo "Creating tag: $NEXT_VERSION"
        git tag "$NEXT_VERSION"
        GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" git push origin "$NEXT_VERSION"

  - name: build-and-push
    image: plugins/docker
    settings:
      dockerfile: Dockerfile
      registry: git.scruzzi.com
      repo: git.scruzzi.com/mattia/scruzzi-website
      auto_tag: true
      username:
        from_secret: gitea_registry_user
      password:
        from_secret: gitea_registry_password
