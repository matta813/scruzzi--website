services:
  scruzzi-website:
    image: registry.scruzzi.com/root/scruzzi-website:latest
    container_name: scruzzi-website
    restart: unless-stopped
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
