name: Lint & Build Docker Image

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint HTML Code
        run: npx --yes htmlhint@latest index.html

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.versioned_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker Metadata
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/nice-bauch"
          VERSION="v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          TAGS="${IMAGE_NAME}:${GITHUB_SHA},${IMAGE_NAME}:${VERSION}"

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            TAGS="${IMAGE_NAME}:latest,${TAGS}"
          fi

          {
            echo "image=${IMAGE_NAME}"
            echo "version=${VERSION}"
            echo "versioned_image=${IMAGE_NAME}:${VERSION}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Release ${VERSION}" \
            --notes "Automatisches Release für Branch ${GITHUB_REF_NAME} und Commit ${GITHUB_SHA}.

          Docker Image:
          ${IMAGE}"
