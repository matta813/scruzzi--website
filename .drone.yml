---
kind: pipeline
type: kubernetes
name: release

trigger:
  event:
    - push
  ref:
    include:
      - refs/heads/main

steps:
  - name: release
    image: alpine
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apk add --no-cache git curl
      - |
        set -eu
        git config user.email "drone@scruzzi.com"
        git config user.name "Drone CI"
        
        REMOTE_URL=$(git remote get-url origin)
        AUTH_URL=$(echo "$REMOTE_URL" | sed "s|gitea@|https://oauth2:${GITEA_TOKEN}@|")
        git remote set-url origin "$AUTH_URL"
        
        LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || echo "")
        
        if [ -z "$LATEST_TAG" ]; then
          NEXT_VERSION="v1.0.0"
        else
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
        fi
        
        echo "Creating tag: $NEXT_VERSION"
        git tag "$NEXT_VERSION"
        git push origin "$NEXT_VERSION"

  - name: build-and-push
    image: plugins/docker
    settings:
      dockerfile: Dockerfile
      registry: git.scruzzi.com
      repo: git.scruzzi.com/mattia/scruzzi-website
      auto_tag: true
      username:
        from_secret: gitea_registry_user
      password:
        from_secret: gitea_registry_password
