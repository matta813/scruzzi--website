services:
  nice-bauch:
    image: ghcr.io/scruzzimattia-blip/scruzzi-website/nice-bauch:latest
    container_name: nice-bauch
    restart: unless-stopped
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - nice-bauch-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    networks:
      - nice-bauch-net

networks:
  nice-bauch-net:
    driver: bridge

volumes:
  nice-bauch-data:
