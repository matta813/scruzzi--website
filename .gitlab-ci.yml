# CI/CD-Flow (Commit → Version-Bump → Image-Build → GitOps-Update):
#
#   1. release        semantic-release analysiert die Conventional Commits auf
#                     main (feat: → minor, fix: → patch, BREAKING CHANGE →
#                     major), bestimmt die nächste SemVer-Version, schreibt
#                     CHANGELOG.md zurück ins Repo ([skip ci]), setzt den
#                     Git-Tag vX.Y.Z und erstellt ein GitLab-Release.
#                     Gibt es keine release-würdigen Commits (nur chore/docs/
#                     ci/…), endet die Pipeline hier ohne Build.
#   2. build          Kaniko baut das Image und pusht es in die Registry als
#                     :X.Y.Z (Deployment-Tag), :sha-<commit> (Nachvollzieh-
#                     barkeit) und :latest (nur für docker-compose/Fallback —
#                     das Cluster-Deployment nutzt den Versions-Tag).
#   3. update-gitops  Klont das GitOps-Repo und pinnt in
#                     apps-flux/scruzzi/scruzzi.yaml den neuen Versions-Tag.
#                     Flux rollt die Änderung automatisch aus; Renovate trackt
#                     denselben Image-Pfad zusätzlich (renovate.json im
#                     GitOps-Repo) und erstellt MRs für neue Tags.
#
# Benötigte CI/CD-Variablen (Settings → CI/CD → Variables, masked, KEINE
# Secrets im Repo):
#   GITLAB_TOKEN  Project Access Token DIESES Repos (Scopes: api,
#                 write_repository) — für semantic-release (Tag, Release,
#                 CHANGELOG-Commit).
#   GITOPS_TOKEN  Project Access Token des gitops-repo (Scope:
#                 write_repository) — zum Pushen des Manifest-Bumps.

stages:
  - release
  - build
  - deploy

workflow:
  rules:
    # Kein Pipeline-Lauf für die von semantic-release gepushten Tags
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

release:
  stage: release
  image: node:22-alpine
  before_script:
    - apk add --no-cache git
  script:
    - npx --yes
      -p semantic-release@24
      -p @semantic-release/changelog@6
      -p @semantic-release/exec@7
      -p @semantic-release/git@10
      -p @semantic-release/gitlab@13
      -p conventional-changelog-conventionalcommits@8
      semantic-release
    # Ohne neue Version bleibt release.env leer → build/deploy überspringen sich selbst
    - test -f release.env || echo "RELEASE_VERSION=" > release.env
  artifacts:
    reports:
      dotenv: release.env

build-and-push:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      if [ -z "${RELEASE_VERSION}" ]; then
        echo "Keine neue Version durch semantic-release — Build übersprungen."
        exit 0
      fi
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${RELEASE_VERSION}"
      --destination "${CI_REGISTRY_IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"

update-gitops:
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "${RELEASE_VERSION}" ]; then
        echo "Keine neue Version — GitOps-Update übersprungen."
        exit 0
      fi
    - git clone "https://gitops-ci:${GITOPS_TOKEN}@${CI_SERVER_HOST}/root/gitops-repo.git" gitops
    - cd gitops
    - git config user.name "scruzzi-website CI"
    - git config user.email "ci@scruzzi.com"
    - sed -i -E "s|(image:[[:space:]]+${CI_REGISTRY}/root/scruzzi-website):.*|\1:${RELEASE_VERSION}|" apps-flux/scruzzi/scruzzi.yaml
    - grep -q "scruzzi-website:${RELEASE_VERSION}" apps-flux/scruzzi/scruzzi.yaml || { echo "Image-Zeile wurde nicht ersetzt!"; exit 1; }
    - 'git commit -am "chore(scruzzi): bump scruzzi-website to ${RELEASE_VERSION}"'
    # Retry gegen Races mit parallelen Renovate-/CI-Pushes
    - |
      for i in 1 2 3; do
        git push origin main && exit 0
        git pull --rebase origin main
      done
      exit 1
