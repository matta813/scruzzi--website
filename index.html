<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nice Bauch</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #060b1b;
      --accent-1: #17e6a1;
      --accent-2: #fbbf24;
      --glass: rgba(255,255,255,0.05);
      --text: #e9eef7;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);}
    body{
      background:
        radial-gradient(800px 600px at 10% 20%, rgba(23,230,161,0.15), transparent 50%),
        radial-gradient(700px 500px at 90% 80%, rgba(251,191,36,0.2), transparent 55%),
        linear-gradient(135deg, #050815 0%, #0a1026 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2.5rem;
      overflow:hidden;
    }
    .shell{
      position:absolute;inset:0;pointer-events:none;
      background:
        conic-gradient(from 210deg at 10% 30%, rgba(23,230,161,0.08), transparent 30%),
        conic-gradient(from 45deg at 90% 70%, rgba(251,191,36,0.06), transparent 35%);
      filter:blur(60px);
      animation: drift 22s linear infinite;
    }
    .card{
      position:relative;
      width:min(900px,96%);
      padding:3rem;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 20px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow:hidden;
    }
    .grid{
      display:grid;
      grid-template-columns:1.1fr 0.9fr;
      gap:2.5rem;
      align-items:center;
    }
    h1{font-weight:700;font-size:clamp(30px,6vw,60px);margin:0 0 0.35rem;letter-spacing:-0.01em;}
    p.sub{margin:0 0 1.4rem;color:rgba(233,238,247,0.78);font-weight:600;font-size:1.05rem;}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:0.6rem;
      padding:0.75rem 1.3rem;
      border-radius:999px;
      background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
      color:#041016;
      font-weight:700;
      letter-spacing:0.3px;
      box-shadow:0 12px 30px rgba(23,230,161,0.3), 0 0 0 1px rgba(4,16,22,0.1);
      transform:translateZ(0);
      transition:transform 180ms ease, box-shadow 180ms ease;
    }
    .pill:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(23,230,161,0.35),0 0 0 1px rgba(4,16,22,0.18);}
    .meta{display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:1.25rem;color:rgba(233,238,247,0.7);}
    .chip{
      padding:0.55rem 0.95rem;
      border-radius:12px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      font-weight:600;
      font-size:0.95rem;
    }
    .badge{
      display:inline-flex;align-items:center;gap:0.4rem;
      font-weight:600;font-size:0.95rem;
      color:var(--accent-1);
    }
    .badge::before{
      content:"";
      width:10px;height:10px;
      border-radius:50%;
      background:var(--accent-1);
      box-shadow:0 0 0 6px rgba(23,230,161,0.12);
    }
    .panel{
      position:relative;
      padding:1.2rem 1.4rem;
      border-radius:16px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .panel h2{margin:0 0 0.4rem;font-size:1.05rem;font-weight:700;letter-spacing:0.01em;}
    .panel p{margin:0;color:rgba(233,238,247,0.8);line-height:1.6;}
    footer{margin-top:1.5rem;color:rgba(233,238,247,0.55);font-size:0.95rem;font-weight:600;}
    .glow{
      position:absolute;inset:0;
      background:radial-gradient(500px 500px at 20% 30%, rgba(23,230,161,0.08), transparent 45%),
                 radial-gradient(350px 350px at 80% 70%, rgba(251,191,36,0.07), transparent 40%);
      pointer-events:none;
      mix-blend-mode:screen;
    }
    @keyframes drift{
      from{transform:translate3d(0,0,0) rotate(0deg);}
      to{transform:translate3d(0,0,0) rotate(360deg);}
    }
    @media (max-width:820px){
      body{padding:1.8rem;}
      .card{padding:2.2rem;}
      .grid{grid-template-columns:1fr;gap:2rem;}
    }
    @media (max-width:480px){
      body{padding:1.4rem;}
      .card{padding:1.8rem;}
    }
  </style>
</head>
<body>
  <div class="shell"></div>
  <div class="card">
    <div class="glow"></div>
    <div class="grid">
      <div>
        <div class="badge">aktiv</div>
        <h1>nice Bauch</h1>
        <p class="sub">läuft auf einem festen Port 🎯</p>
        <div class="pill">nice Bauch</div>
        <div class="meta">
          <div class="chip">Port 8085</div>
          <div class="chip">leichtgewichtig</div>
          <div class="chip">bereit</div>
        </div>
      </div>
      <div class="panel">
        <h2>Was steckt dahinter?</h2>
        <p>Ein schlankes Single-Page-Setup, bereit, sofort zu liefern. Minimaler Overhead, klarer Fokus auf den Kerninhalt, stabil auf deinem Server.</p>
        <footer>Ubuntu Server — powered by Python3</footer>
      </div>
    </div>
  </div>
</body>
</html>
