services:
  nice-bauch:
    build: .
    image: nice-bauch:local
    container_name: nice-bauch
    restart: unless-stopped
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    networks:
      - nice-bauch-net

networks:
  nice-bauch-net:
    driver: bridge
