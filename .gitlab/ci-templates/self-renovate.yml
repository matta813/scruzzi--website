# Runs Renovate against only the repo it executes in (RENOVATE_REPOSITORIES
# is pinned to $CI_PROJECT_PATH), separate from the cluster-wide Renovate
# in gitops-repo (which only watches apps-flux/*.yaml image tags and never
# touches these repos' own Dockerfile/CI pins). Needs a GitLab Pipeline
# Schedule (Settings → CI/CD → Schedules) targeting `main` — this job only
# runs on that trigger, never on a normal push.
#
# Reuses the GITLAB_TOKEN CI/CD variable already configured for
# semantic-release (scopes: api, write_repository are sufficient for
# Renovate to open MRs too).
#
# Local to this repo only — channieinifigge-website has its own copy in
# its .gitlab-ci.yml rather than cross-project-including this file: its
# scheduled pipeline runs as that repo's own bot user, which has no
# access to this project, so the include would fail to resolve.

self-renovate:
  stage: renovate
  image: renovate/renovate:43.283.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "https://gitlab.scruzzi.com/api/v4"
    RENOVATE_TOKEN: $GITLAB_TOKEN
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_AUTODISCOVER: "false"
    GIT_AUTHOR_NAME: "Renovate Bot"
    GIT_AUTHOR_EMAIL: "renovate@scruzzi.com"
    GIT_COMMITTER_NAME: "Renovate Bot"
    GIT_COMMITTER_EMAIL: "renovate@scruzzi.com"
  script:
    - renovate
