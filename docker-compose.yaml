services:
  scruzzi-website:
    image: ghcr.io/matta813/scruzzi--website:1.6.0
    container_name: scruzzi-website
    restart: unless-stopped
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
